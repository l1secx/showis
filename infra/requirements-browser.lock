# Showis BROWSER servisi bagimlilik kilidi (T-337, T-341)
#
# Neden ayri lock: `showis-browser` yalnizca HTTP API + engine calistirir. Ana
# `infra/requirements.lock` icindeki celery/sqlalchemy/alembic/asyncpg/reportlab gibi agir
# runtime paketleri tarayici imajinda gereksiz (imaji sisirir, saldiri yuzeyini buyutur).
#
# KURAL: ana lock ile ortak paketlerde surumler BIREBIR aynidir (elle surum yazilmaz).
#   * Tohum: fastapi, uvicorn, pydantic, httpx (servis) + pillow (engine bagimliligi)
#   * T-341: `playwright==1.55.0` — base imajdaki tarayici ikilileriyle ESLESEN surum
#     (dogrulama: `playwright install --dry-run chromium` -> Install location:
#     /ms-playwright/chromium-1187; imajda chromium-1187 hazir). Base imajda Python
#     paketi YOKTU; bu yuzden servis aylarca httpx fallback'inde calisiyordu.
#   * `greenlet` (3.5.6) ve `pyee` (13.0.1) playwright'in bagimliliklari; greenlet ana
#     lock'ta da ayni surumde, pyee yalnizca tarayici tarafinda.
#   * Tarayici ikilileri (chromium/firefox/webkit) imajdan gelir — `playwright install`
#     CALISTIRILMAZ (imaj zaten hazir kuruyor, indirme yok).
#
# BAKIM: ortak satirlar `infra/requirements.lock`'tan birebir kopyalanir; yeni bir
# transitif bagimlilik cikarsa imajda `pip freeze` ile closure yeniden olculur.

