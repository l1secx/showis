# NOT (OPS-01): `version:` anahtarı Compose v2'de gereksiz (obsolete uyarısı
# üretiyordu) ve kaldırıldı. Bu dosya Docker Compose v2 (`docker compose`
# eklentisi) gerektirir — v1 `docker-compose`, `depends_on.condition:
# service_healthy` semantiğini v3 dosyalarında güvenilir şekilde desteklemez.

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  # D-012 (SEC-01, dokümantasyon): bu ağ "dışa çıkış yalnız worker/browser'da"
  # niyetini taşır; ancak frontend/backend'de `internal: true` YOK — USE_CELERY=0
  # (varsayılan) modunda taramalar API sürecinde koştuğu için API'nin dışarı
  # çıkması gerekir, bu yüzden zorunlu tutulmuyor. Wave 3 planında prod profili
  # önerilecek (USE_CELERY=1 + internal ağlar); o profilde API'ye egress
  # verilmemeli.
  egress:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  report_data:
  caddy_data:

services:
  caddy:
    # Digest pinli (v2.7.6). Tag'e surum yazmak yerine digest: ayni imaj, kaymaz.
    image: caddy:2.7-alpine@sha256:2e1d4592f1718bb47645da5a83a846fe19094f18e6c921fdf56d174f05c63213
    container_name: showis-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
      - "8443:8443"
    environment:
      # Ikinci savunma katmani (opsiyonel, env-gated). Bos ise basic_auth devre disi.
      - SHOWIS_CADDY_USER=${SHOWIS_CADDY_USER:-}
      - SHOWIS_CADDY_PASSWORD_HASH=${SHOWIS_CADDY_PASSWORD_HASH:-}
      - SHOWIS_CADDY_USERS=${SHOWIS_CADDY_USERS:-}
      - SHOWIS_EDGE_FORWARD_AUTH=${SHOWIS_EDGE_FORWARD_AUTH:-0}
      # T-319: beklenen Host listesi (virgulle). BOS ise Host dogrulamasi devre disi.
      # Onerilen: localhost,127.0.0.1,l1sec,<LAN-IP>  (DHCP degisirse guncelleyin)
      - SHOWIS_ALLOWED_HOSTS=${SHOWIS_ALLOWED_HOSTS:-}
      - SHOWIS_TLS_HOSTS=${SHOWIS_TLS_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./scripts/caddy-render-config.sh:/usr/local/bin/caddy-render-config.sh:ro
      # Internal CA kok sertifikasi ve otomatik kayit kalici olsun.
      - caddy_data:/data
    # Caddyfile'da kosullu blok yok: basic_auth bloğu baslangicta render edilir.
    command: ["/bin/sh", "/usr/local/bin/caddy-render-config.sh"]
    # read_only + tmpfs (T-314): Caddy yalniz /tmp (render edilen config), /config ve
    # /data (autosave.json) yazar. Uc alan da tmpfs; kok dosya sistemi salt-okunur.
    # Dogrulama: ayni ayarlarla test konteyneri "serving initial configuration" +
    # "unable to autosave" hatasi YOK.
    # T-336: saglik kontrolu — /health ve / 401/200 doner (basic auth), bu yuzden
    # liveness icin Caddy admin API'si (127.0.0.1:2019) kullanilir. `localhost`
    # konteynerde ::1'e cozuldugu icin acikca 127.0.0.1 yazildi (olculdu).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
      - /config
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

  postgres:
    # Digest pinli (PostgreSQL 16.15).
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: showis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-showis}
      # T-336: guvensiz varsayilan KALDIRILDI (fail-fast).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil - infra/.env (bkz. .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-showis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-showis} -d ${POSTGRES_DB:-showis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Digest pinli (Redis 7.4.12).
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    container_name: showis-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # `latest` KALDIRILDI (SEC-17): digest pinli, DEVELOPMENT.2025-05-24 build'i.
    # Not: upstream minio/minio Docker Hub'dan kaldirildi; bitnami legacy arsivi kullaniliyor.
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: showis-minio
    restart: unless-stopped
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY tanimli degil - infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY tanimli degil - infra/.env}
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    container_name: showis-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-showis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil - infra/.env (bkz. .env.example)}@postgres:5432/${POSTGRES_DB:-showis}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY tanimli degil - infra/.env}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY tanimli degil - infra/.env}
      - MINIO_BUCKET=${MINIO_BUCKET:-showis-evidence}
      - MASTER_KEY=${MASTER_KEY:?MASTER_KEY tanimli degil - infra/.env}
      - BROWSER_SERVICE_URL=http://browser:8081
      - SHOWIS_REPORT_DIR=/app/data/reports
      - SHOWIS_EVIDENCE_DIR=/app/data/evidence
      # T-329 (/healthz disk kontrolu) + T-336 tutarlilik: acik veri dizini.
      - SHOWIS_DATA_DIR=/app/data
      - USE_CELERY=${USE_CELERY:-0}
      # SEC-01: API kimlik dogrulamasi. Bos birakilirsa API fail-closed (503) calisir,
      # bu yuzden compose seviyesinde zorunlu tutuluyor (fail-fast).
      - SHOWIS_API_TOKEN=${SHOWIS_API_TOKEN:?SHOWIS_API_TOKEN tanimli degil - infra/.env dosyasina ekleyin (bkz. infra/.env.example)}
      # D-010 (T-302/CFG-01): .env.example'de belgelenen ayar knobs'lari artik
      # api'ye iletiliyor (daha once sessizce yok sayiliyorlardi). Hepsi opsiyonel:
      # bos ise uygulamanin guvenli varsayilani gecerlidir.
      # SHOWIS_AUTH_DISABLED bilincli olarak ILETILMEZ (test/dev bypass'i
      # konteynere sizmaz; API yalniz imaj/env uzerinden ayarlanabilir kalir).
      - SHOWIS_ALLOWED_ORIGINS=${SHOWIS_ALLOWED_ORIGINS:-}
      - SHOWIS_SCAN_CONCURRENCY=${SHOWIS_SCAN_CONCURRENCY:-}
      - SHOWIS_HOST_MAX_CONCURRENCY=${SHOWIS_HOST_MAX_CONCURRENCY:-}
      - SHOWIS_HOST_MIN_INTERVAL=${SHOWIS_HOST_MIN_INTERVAL:-}
      - SHOWIS_MAX_BODY_BYTES=${SHOWIS_MAX_BODY_BYTES:-}
      - SHOWIS_SSE_MAX_SECONDS=${SHOWIS_SSE_MAX_SECONDS:-}
      - SHOWIS_SSE_QUEUE_MAXSIZE=${SHOWIS_SSE_QUEUE_MAXSIZE:-}
      - SHOWIS_DOCS_ENABLED=${SHOWIS_DOCS_ENABLED:-}
      - SHOWIS_LLM_BASE_URL_ALLOWLIST=${SHOWIS_LLM_BASE_URL_ALLOWLIST:-}
      - SHOWIS_SITECHECK_CACHE_TTL=${SHOWIS_SITECHECK_CACHE_TTL:-}
      - SHOWIS_TRUSTED_PROXIES=${SHOWIS_TRUSTED_PROXIES:-}
      - SHOWIS_TRUST_ACTOR_HEADER=${SHOWIS_TRUST_ACTOR_HEADER:-0}
      - SHOWIS_ACTOR_ROLES=${SHOWIS_ACTOR_ROLES:-}
      # Edge forward_auth: API, bcrypt hash'leri bu env'lerden doğrular.
      - SHOWIS_CADDY_USER=${SHOWIS_CADDY_USER:-}
      - SHOWIS_CADDY_PASSWORD_HASH=${SHOWIS_CADDY_PASSWORD_HASH:-}
      - SHOWIS_CADDY_USERS=${SHOWIS_CADDY_USERS:-}
    # umask 077 (T-314): imajdaki entrypoint-api.sh de ayni degeri set eder; bu override
    # sayesinde imaj yeniden derlenmeden de yeni raporlar 0600/0700 olur (ikisi de 077).
    command: ["/bin/sh", "-c", "umask 077 && exec uvicorn showis.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - report_data:/app/data
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
      args:
        - API_URL=http://api:8000
    container_name: showis-web
    restart: unless-stopped
    # 8005 publish'i KALDIRILDI (T-111): web yalniz frontend aginda, erisim Caddy
    # uzerinden http://localhost:8083. Dogrudan 8005 tam API yuzeyi veriyordu.
    environment:
      - API_URL=http://api:8000
      # Runtime env (build arg DEGIL): token Next standalone imaja gomulmez,
      # yalniz sunucu surecinde okunur (apps/web/app/api/[...path]/route.ts).
      - SHOWIS_API_TOKEN=${SHOWIS_API_TOKEN:?SHOWIS_API_TOKEN tanimli degil - infra/.env dosyasina ekleyin (bkz. infra/.env.example)}
    networks:
      - frontend
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    # T-336: healthcheck eksikti; imajda busybox wget var (dogrulandi).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: showis-worker
    restart: unless-stopped
    # --concurrency: mem_limit 1g altinda 12 prefork cocuk OOM riski tasir;
    # varsayilan 2, gerektiginde SHOWIS_WORKER_CONCURRENCY ile yukseltilir.
    # umask 077 (T-314): worker kanit dosyasi yazar (EvidenceStore) — yeni dosyalar 0600,
    # yeni klasorler 0700 olsun (varsayilan 0022 -> 0644/0755 kisisel veri sizintisi).
    command: ["/bin/sh", "-c", "umask 077 && exec celery -A showis.services.worker.celery_app worker -l INFO -Q ${SHOWIS_SCAN_QUEUE:-osint} --concurrency ${SHOWIS_WORKER_CONCURRENCY:-2}"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-showis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil - infra/.env (bkz. .env.example)}@postgres:5432/${POSTGRES_DB:-showis}
      - REDIS_URL=redis://redis:6379/0
      - BROWSER_SERVICE_URL=http://browser:8081
      - MASTER_KEY=${MASTER_KEY:?MASTER_KEY tanimli degil - infra/.env}
      - SHOWIS_REPORT_DIR=/app/data/reports
      - SHOWIS_EVIDENCE_DIR=/app/data/evidence
      - SHOWIS_STALE_SCAN_SECONDS=${SHOWIS_STALE_SCAN_SECONDS:-1800}
      - SHOWIS_SCAN_MAX_RECOVERY_ATTEMPTS=${SHOWIS_SCAN_MAX_RECOVERY_ATTEMPTS:-2}
      - SHOWIS_SCAN_MAX_RETRIES=${SHOWIS_SCAN_MAX_RETRIES:-2}
      - SHOWIS_SCAN_RECOVERY_INTERVAL=${SHOWIS_SCAN_RECOVERY_INTERVAL:-120}
    volumes:
      - report_data:/app/data
    networks:
      - backend
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    # T-337: healthcheck. `pgrep` imajda YOK; `celery inspect ping` broker'a gidip
    # child'lardan pong bekler (~1.1s olculdu) — yalniz surec varligini degil
    # broker baglantisini ve yanit verebilirligini de dogrular. Celery acilisi yavas
    # oldugu icin start_period 60s; 60s'de bir maliyet ~%2 CPU.
    healthcheck:
      test: ["CMD-SHELL", "celery -A showis.services.worker.celery_app inspect ping -d celery@$$(hostname) --timeout 5 2>&1 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  beat:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: showis-beat
    restart: unless-stopped
    command: ["celery", "-A", "showis.services.worker.celery_app", "beat", "-l", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-showis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil - infra/.env (bkz. .env.example)}@postgres:5432/${POSTGRES_DB:-showis}
      - REDIS_URL=redis://redis:6379/0
      - MASTER_KEY=${MASTER_KEY:?MASTER_KEY tanimli degil - infra/.env}
      - SHOWIS_SCAN_RECOVERY_INTERVAL=${SHOWIS_SCAN_RECOVERY_INTERVAL:-120}
      - SHOWIS_STALE_SCAN_SECONDS=${SHOWIS_STALE_SCAN_SECONDS:-1800}
      - SHOWIS_SCAN_MAX_RECOVERY_ATTEMPTS=${SHOWIS_SCAN_MAX_RECOVERY_ATTEMPTS:-2}
    networks:
      - backend
    depends_on:
      - worker
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    # T-337: beat icin "ping" yok (worker protokolu degil). En hafif guvenilir probe:
    # PID 1'in (celery beat) komut satirini oku — imajda pgrep/ps YOK, /proc taramasi
    # kendi kabugunu da eslestirirdi. Siniri: takilmis (hung) beat yine gecer; scheduler
    # hatasi journal'da izlenmeli. ($ degiskeni YOK -> compose interpolasyon riski yok.)
    healthcheck:
      test: ["CMD-SHELL", 'tr "\0" " " < /proc/1/cmdline 2>/dev/null | grep -q "celery.*beat"']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  browser:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.browser
    container_name: showis-browser
    restart: unless-stopped
    networks:
      - backend
      - egress
    # T-341: Playwright/Chromium icin paylasilan bellek. Docker varsayilani 64MB; hafif
    # sayfalarda olcumde 0MB cikti ama buyuk DOM'lu sayfalarda Chromium coker. 512MB
    # tmpfs yalniz kullanildigi kadar tuketir ve 2g'lik cgroup limininin icindedir.
    shm_size: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 5
