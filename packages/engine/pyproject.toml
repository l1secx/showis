[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "showis-engine"
version = "0.1.0"
description = "Showis OSINT Engine"
dependencies = [
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "showis-contracts",
    "showis-llm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["showis_engine*"]
