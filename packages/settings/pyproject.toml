[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "showis-settings"
version = "0.1.0"
description = "Settings and crypto utilities for Showis"
dependencies = [
    "cryptography>=42.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["showis_settings*"]
