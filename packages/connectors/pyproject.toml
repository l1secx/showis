[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "showis-connectors"
version = "0.1.0"
description = "Showis OSINT Connectors"
dependencies = [
    "httpx>=0.27.0",
    "showis-contracts",
    "showis-engine",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["showis_connectors*"]
