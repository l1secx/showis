[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "showis-contracts"
version = "0.1.0"
description = "Core contract schemas and types for Showis OSINT"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["showis_contracts*"]
