[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "showis-monorepo"
version = "0.1.0"
description = "Showis OSINT Monorepo"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "jinja2>=3.1.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "reportlab>=4.0.0",
    "bcrypt>=4.1.0",
]

# NOT (SET-02): `showis-contracts` (ve diğer showis-* paketleri) PyPI'da
# bulunmaz; packages/ altındaki yerel dizinlerdir. `make bootstrap` onları
# tek pip çağrısında -e ile kurar; bu yüzden burada bağımlılık olarak
# listelenmezler (PyPI çözümüne düşmemeleri için).

[tool.setuptools]
# Sanal meta-paket (SET-01): bu distribution kendi Python paketi İÇERMEZ;
# amacı üst-düzey bağımlılıkların + dev araçlarının TEK kurulum noktası
# olması (`pip install -e '.[dev]'`). Flat-layout otomatik keşfi (apps/,
# packages/, docs/ gibi çoklu üst-dizinler yüzünden) bu yapılandırma olmadan
# build'i reddediyordu. Yerel showis-* paketleri packages/ altındandır.
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    # SET-03: SQLAlchemy asyncio (greenlet) + test DB (aiosqlite). CI bunları
    # ayrı pinliyordu; pyproject'tan kurulan taze venv testleri koşamıyordu.
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "packages/contracts/tests",
    "apps/api/tests",
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# T-312: asilan bir test CI isini surestiz bloke etmesin. `faulthandler` pytest
# cekirdeginde gelir (ek bagimlilik YOK): esik asilirsa tum thread'lerin stack
# dokumu basilir ve surec sonlanir -> is "sonsuz kosuyor" yerine FAIL olur.
# En yavas test ~3 sn oldugu icin 120 sn genis bir guvenlik agi.
faulthandler_timeout = 120
faulthandler_exit_on_timeout = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
